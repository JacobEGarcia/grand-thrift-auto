<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Grand Thrift Auto</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:Inter,ui-sans-serif,system-ui}canvas{display:block;width:100%;height:100%;image-rendering:auto}.boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#452b78,#101522 50%,#06070c);z-index:9;transition:.5s}.card{width:min(700px,90vw);padding:40px;border:1px solid #ffffff22;background:#0b0f18dd;box-shadow:0 30px 100px #000;border-radius:6px;text-align:center}.logo{font-size:clamp(42px,9vw,86px);font-weight:1000;line-height:.82;letter-spacing:-.08em;text-transform:uppercase}.logo b{color:#dcff4f}.tag{margin:22px 0;color:#b8bed0;letter-spacing:.16em;text-transform:uppercase;font-size:12px}.start{border:0;background:#dcff4f;color:#0b0d12;padding:15px 28px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:5px 5px 0 #a755ff}.keys{margin-top:24px;color:#7f879a;font-size:12px;line-height:1.8}.hide{opacity:0;pointer-events:none}.note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 14px;background:#080b11df;border:1px solid #ffffff1d;color:#aab1c4;font-size:11px;z-index:8}
</style></head><body><canvas id="c"></canvas><div class="boot" id="boot"><div class="card"><div class="logo">GRAND<br><b>THRIFT</b> AUTO</div><div class="tag">One city's castoffs. Your next empire.</div><button class="start" id="start">START HUSTLING</button><div class="keys">WASD / ARROWS - move & drive · E - enter stores / vehicles · F - scan racks<br>SPACE - buy / sell · 1-4 - change fit · M - missions · R - restart</div></div></div><div class="note">A rights-clean original game · audio starts after click</div><script>
const C=document.querySelector('#c'),X=C.getContext('2d'); let W,H,D=window.devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)} addEventListener('resize',resize);resize();
const keys={},pressed={}; addEventListener('keydown',e=>{if(!keys[e.code])pressed[e.code]=1;keys[e.code]=1;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=0);
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let audio; function beep(freq=300,d=.06,type='square',vol=.025){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}
const world={w:2400,h:1800}, roads=[{x:0,y:240,w:2400,h:150},{x:0,y:760,w:2400,h:160},{x:0,y:1350,w:2400,h:150},{x:400,y:0,w:160,h:1800},{x:1120,y:0,w:170,h:1800},{x:1900,y:0,w:160,h:1800}];
const stores=[
{x:110,y:70,w:230,h:140,n:'SECOND CHANCE',c:'#ff6c9f',tier:1},{x:650,y:480,w:350,h:200,n:'VELVET BIN',c:'#9d65ff',tier:2},{x:1450,y:70,w:330,h:150,n:'ARCHIVE 88',c:'#45e4c2',tier:3},{x:2100,y:1030,w:230,h:180,n:'MOTH & GOLD',c:'#ffb64a',tier:3},{x:1370,y:1570,w:360,h:160,n:'THE LAST RACK',c:'#d9ff55',tier:4}
];
const buildings=[]; for(let x=30;x<world.w;x+=220)for(let y=20;y<world.h;y+=190){if(roads.some(r=>x<r.x+r.w&&x+160>r.x&&y<r.y+r.h&&y+130>r.y)||stores.some(s=>x<s.x+s.w&&x+160>s.x&&y<s.y+s.h&&y+130>s.y))continue;buildings.push({x,y,w:rand(110,180),h:rand(80,140),tone:Math.floor(rand(0,4))})}
const items=[['Vintage Bulls Jacket',42,120,'RARE'],['90s Band Tee',18,55,'GOOD'],['Selvedge Denim',30,78,'GOOD'],['Designer Loafers',55,160,'GRAIL'],['Leather Camera Bag',22,70,'GOOD'],['Faded Work Shirt',8,24,'COMMON'],['Silver Western Belt',26,90,'RARE'],['Corduroy Cap',6,19,'COMMON'],['Deadstock Sneakers',48,145,'GRAIL'],['Wool Overcoat',34,105,'RARE'],['Tour Hoodie',17,52,'GOOD'],['Silk Scarf',9,38,'GOOD']];
const cars=[{x:760,y:305,a:0,c:'#ffcf45',name:'Hatchback'},{x:1550,y:835,a:Math.PI,c:'#5ce1e6',name:'Van'},{x:2100,y:1420,a:0,c:'#ff5c75',name:'Coupe'}];
const people=Array.from({length:35},()=>({x:rand(40,2360),y:rand(40,1760),a:rand(0,6.28),c:`hsl(${rand(0,360)},50%,65%)`}));
let p,cam,missions,msgs,shop=null,racks=[],time=0,night=0,playing=false;
function reset(){p={x:500,y:520,a:0,cash:120,rep:0,fit:0,inv:[],car:null,scan:0,total:0};cam={x:0,y:0};missions=[{t:'BIN BEGINNINGS',d:'Buy any thrift find',goal:1,n:0,reward:40},{t:'FLIP SEASON',d:'Earn $100 in resale profit',goal:100,n:0,reward:80},{t:'GRAIL TRAIL',d:'Find 2 RARE or GRAIL pieces',goal:2,n:0,reward:125},{t:'CITYWIDE DRIP',d:'Visit all 5 thrift stores',goal:5,n:0,reward:200}];msgs=[];shop=null;racks=[];time=0;night=0;toast('New day. $120 in your pocket. Build the thrift empire.');}
function toast(t,c='#fff'){msgs.unshift({t,c,life:4});msgs=msgs.slice(0,4)}
function active(){return missions.find(m=>m.n<m.goal)} function complete(m){if(m.n>=m.goal&&!m.done){m.done=1;p.cash+=m.reward;p.rep+=25;toast(`MISSION COMPLETE +$${m.reward}`,'#dcff4f');beep(760,.18,'sawtooth')}}
function near(o,d=90){return Math.hypot(p.x-(o.x+o.w/2||o.x),p.y-(o.y+o.h/2||o.y))<d}
function enterStore(s){shop=s;racks=Array.from({length:8},(_,i)=>{let q=items[Math.floor(Math.random()*items.length)];let mult=.75+s.tier*.08;return{q,price:Math.max(3,Math.round(q[1]*mult)),sold:false,x:W*.18+(i%4)*W*.17,y:H*.31+Math.floor(i/4)*H*.26}}); if(!s.vis){s.vis=1;missions[3].n++;complete(missions[3])}toast(`Entered ${s.n}`);beep(480)}
function buy(r){if(r.sold)return;if(p.cash<r.price)return toast('Not enough cash. Flip what you have.','#ff718c');p.cash-=r.price;r.sold=1;p.inv.push({name:r.q[0],buy:r.price,value:r.q[2],rarity:r.q[3]});p.rep+=r.q[3]=='GRAIL'?10:r.q[3]=='RARE'?6:2;missions[0].n=1;complete(missions[0]);if(['RARE','GRAIL'].includes(r.q[3])){missions[2].n++;complete(missions[2])}toast(`${r.q[0]} secured for $${r.price}`,'#dcff4f');beep(620)}
function sell(){if(!p.inv.length)return toast('Your trunk is empty. Hit the racks.');let it=p.inv.shift(),sale=Math.round(it.value*(.85+Math.random()*.35)+p.rep*.12),profit=sale-it.buy;p.cash+=sale;p.total+=profit;missions[1].n+=Math.max(0,profit);complete(missions[1]);toast(`SOLD ${it.name} +$${sale} (${profit>=0?'+':''}$${profit})`,'#45e4c2');beep(820)}
function update(dt){if(!playing)return;time+=dt;night=(Math.sin(time*.018)+1)/2;msgs.forEach(m=>m.life-=dt);msgs=msgs.filter(m=>m.life>0); if(keys.KeyR){reset();keys.KeyR=0}if(shop){if(pressed.Escape||pressed.KeyE){shop=null;toast('Back on the street.');}if(pressed.Space){let best=racks.filter(r=>!r.sold).sort((a,b)=>Math.hypot(a.x-W/2,a.y-H*.58)-Math.hypot(b.x-W/2,b.y-H*.58))[0];if(best&&Math.hypot(best.x-W/2,best.y-H*.58)<140)buy(best)} if(pressed.KeyF){racks.forEach(r=>r.reveal=2.5);beep(360)} }else{
 let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0); if(dx||dy){let len=Math.hypot(dx,dy);dx/=len;dy/=len;p.a=Math.atan2(dy,dx)} let sp=p.car?230:125;p.x=clamp(p.x+dx*sp*dt,20,world.w-20);p.y=clamp(p.y+dy*sp*dt,20,world.h-20); if(p.car){p.car.x=p.x;p.car.y=p.y;p.car.a=p.a}
 if(pressed.KeyE){if(p.car){toast(`Parked the ${p.car.name}`);p.car=null}else{let car=cars.find(c=>Math.hypot(p.x-c.x,p.y-c.y)<75);let st=stores.find(s=>near(s,130));if(car){p.car=car;toast(`Driving ${car.name}`);beep(180)}else if(st)enterStore(st)}} if(pressed.Space){let zone={x:2170,y:630};if(Math.hypot(p.x-zone.x,p.y-zone.y)<130)sell()}
 }
 if(pressed.Digit1||pressed.Digit2||pressed.Digit3||pressed.Digit4){p.fit=pressed.Digit1?0:pressed.Digit2?1:pressed.Digit3?2:3;toast(['Canvas Classic','Neon Archive','Workwear Royalty','Midnight Grail'][p.fit]);beep(540)}for(let k in pressed)delete pressed[k];cam.x+=(clamp(p.x-W/2,0,world.w-W)-cam.x)*.1;cam.y+=(clamp(p.y-H/2,0,world.h-H)-cam.y)*.1;}
function rr(x,y,w,h,r=8){X.beginPath();X.roundRect(x,y,w,h,r);X.fill()}function text(t,x,y,s=14,c='#fff',align='left',weight=600){X.fillStyle=c;X.font=`${weight} ${s}px Inter,system-ui`;X.textAlign=align;X.fillText(t,x,y)}
function drawCity(){X.save();X.translate(-cam.x,-cam.y);X.fillStyle='#15222a';X.fillRect(0,0,world.w,world.h); // lots
 X.fillStyle='#10161c';roads.forEach(r=>X.fillRect(r.x,r.y,r.w,r.h));X.strokeStyle='#59616a';X.setLineDash([28,30]);X.lineWidth=3;roads.forEach(r=>{X.beginPath(); if(r.w>r.h){X.moveTo(r.x,r.y+r.h/2);X.lineTo(r.x+r.w,r.y+r.h/2)}else{X.moveTo(r.x+r.w/2,r.y);X.lineTo(r.x+r.w/2,r.y+r.h)}X.stroke()});X.setLineDash([]);
 buildings.forEach(b=>{X.fillStyle=['#24313a','#28333e','#202d37','#30343e'][b.tone];X.fillRect(b.x,b.y,b.w,b.h);X.fillStyle='#f4ca6b33';for(let xx=b.x+15;xx<b.x+b.w-10;xx+=35)for(let yy=b.y+18;yy<b.y+b.h-10;yy+=35)X.fillRect(xx,yy,15,12);X.fillStyle='#0b1117';X.fillRect(b.x-7,b.y+b.h,b.w+14,8)});
 stores.forEach(s=>{X.fillStyle=s.c+'33';X.fillRect(s.x-8,s.y-8,s.w+16,s.h+16);X.fillStyle='#17121e';X.fillRect(s.x,s.y,s.w,s.h);X.fillStyle=s.c;X.fillRect(s.x,s.y,s.w,10);for(let i=0;i<3;i++){X.fillStyle=s.c+'55';X.fillRect(s.x+20+i*65,s.y+45,45,55)}text(s.n,s.x+s.w/2,s.y+28,13,s.c,'center',900);if(near(s,150)){text('E  ENTER',s.x+s.w/2,s.y-18,13,'#fff','center',900)}});
 // resale
 X.fillStyle='#45e4c233';X.beginPath();X.arc(2170,630,115,0,7);X.fill();text('THE EXCHANGE',2170,620,18,'#45e4c2','center',900);text('SPACE · SELL OLDEST FIND',2170,646,11,'#fff','center',700);
 people.forEach(q=>{q.x+=Math.cos(q.a)*.15;q.y+=Math.sin(q.a)*.15;X.fillStyle='#070a0e';X.beginPath();X.arc(q.x,q.y,9,0,7);X.fill();X.fillStyle=q.c;X.fillRect(q.x-5,q.y-2,10,16)});
 cars.forEach(c=>{if(p.car===c)return;X.save();X.translate(c.x,c.y);X.rotate(c.a);X.fillStyle=c.c;rr(-27,-15,54,30,8);X.fillStyle='#192631';X.fillRect(-14,-11,28,22);X.fillStyle='#fff';X.fillRect(20,-10,5,7);X.fillRect(20,4,5,7);X.restore()});
 // player / active car
 if(p.car){X.save();X.translate(p.x,p.y);X.rotate(p.a);X.fillStyle=p.car.c;rr(-34,-18,68,36,10);X.fillStyle='#121d25';X.fillRect(-16,-14,32,28);X.fillStyle='#dcff4f';X.fillRect(27,-12,6,8);X.fillRect(27,4,6,8);X.restore()}else{let fc=['#e7e1d2','#a55cff','#c58d4e','#22252f'][p.fit];X.fillStyle='#050609';X.beginPath();X.arc(p.x,p.y-9,10,0,7);X.fill();X.fillStyle=fc;rr(p.x-9,p.y,18,25,4);X.fillStyle='#dcff4f';X.fillRect(p.x-12,p.y+6,4,13)}
 X.restore()}
function hud(){let g=X.createLinearGradient(0,0,0,130);g.addColorStop(0,'#05070be8');g.addColorStop(1,'#05070b00');X.fillStyle=g;X.fillRect(0,0,W,150);text('GRAND THRIFT AUTO',24,35,20,'#dcff4f','left',1000);text(`$${p.cash}`,24,67,29,'#fff','left',1000);text(`REP ${p.rep}  ·  PROFIT $${p.total}`,25,91,11,'#939bac','left',800);let m=active();if(m){X.fillStyle='#0b0e16dd';rr(W-310,20,286,76,6);text(m.t,W-292,45,13,'#dcff4f','left',900);text(m.d,W-292,67,11,'#c5cad6');X.fillStyle='#252b38';rr(W-292,77,250,5,2);X.fillStyle='#dcff4f';rr(W-292,77,250*clamp(m.n/m.goal,0,1),5,2);text(`${Math.min(Math.floor(m.n),m.goal)}/${m.goal}`,W-38,46,11,'#fff','right',800)}
 X.fillStyle='#090c12dc';rr(20,H-112,270,88,6);text('TRUNK',36,H-84,11,'#8f97aa', 'left',900);text(`${p.inv.length} FINDS`,36,H-55,20,'#fff','left',1000);text(p.inv[0]?.name||'Empty - hit a thrift store',36,H-35,10,p.inv.length?'#45e4c2':'#747d91');
 let scale=125/world.w;X.fillStyle='#090c12dd';rr(W-190,H-135,166,111,4);X.save();X.translate(W-181,H-127);X.scale(scale,scale);X.fillStyle='#26303a';X.fillRect(0,0,world.w,world.h);X.fillStyle='#67717e';roads.forEach(r=>X.fillRect(r.x,r.y,r.w,r.h));stores.forEach(s=>{X.fillStyle=s.c;X.fillRect(s.x,s.y,s.w,s.h)});X.fillStyle='#fff';X.beginPath();X.arc(p.x,p.y,35,0,7);X.fill();X.restore();msgs.forEach((m,i)=>{X.globalAlpha=clamp(m.life,0,1);text(m.t,W/2,H-38-i*24,13,m.c,'center',850)});X.globalAlpha=1;
 if(!shop){let car=cars.find(c=>Math.hypot(p.x-c.x,p.y-c.y)<75),st=stores.find(s=>near(s,130));if((car||st)&&!p.car){X.fillStyle='#07090def';rr(W/2-90,H*.72,180,42,4);text(car?'E · DRIVE':'E · ENTER',W/2,H*.72+27,13,'#fff','center',900)}}}
function shopDraw(){let s=shop;let grad=X.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#130f21');grad.addColorStop(1,'#071719');X.fillStyle=grad;X.fillRect(0,0,W,H); // wall decor
 for(let i=0;i<20;i++){X.fillStyle=i%2?s.c+'18':'#ffffff08';X.fillRect(i*W/20,0,W/40,H)}text(s.n,36,47,23,s.c,'left',1000);text('CURATED CHAOS · F TO SCAN RACKS · E TO EXIT',36,71,10,'#a2a9ba','left',800);text(`$${p.cash}`,W-36,52,26,'#fff','right',1000);
 X.strokeStyle='#8890a044';X.lineWidth=5;X.beginPath();X.moveTo(W*.12,H*.44);X.lineTo(W*.88,H*.44);X.stroke();X.beginPath();X.moveTo(W*.12,H*.70);X.lineTo(W*.88,H*.70);X.stroke();
 racks.forEach((r,i)=>{if(r.sold)return;let bob=Math.sin(time*2+i)*3;X.save();X.translate(r.x,r.y+bob);X.strokeStyle='#c0c5cf';X.lineWidth=2;X.beginPath();X.arc(0,-44,10,Math.PI,0);X.lineTo(17,-22);X.stroke();let col={'COMMON':'#aeb5bf','GOOD':'#45e4c2','RARE':'#a55cff','GRAIL':'#dcff4f'}[r.q[3]];X.fillStyle=col;X.beginPath();X.moveTo(-22,-23);X.lineTo(-9,-33);X.lineTo(9,-33);X.lineTo(22,-23);X.lineTo(14,20);X.lineTo(-14,20);X.closePath();X.fill();X.fillStyle='#07090d';X.fillRect(-7,-30,14,24);if(r.reveal>0){r.reveal-=1/60;X.fillStyle='#080b10e8';rr(-75,28,150,63,4);text(r.q[0],0,49,11,'#fff','center',800);text(`${r.q[3]}  $${r.price} → ~$${r.q[2]}`,0,69,10,col,'center',900)}X.restore()});
 text('YOU',W/2,H*.86,10,'#fff','center',900);let fc=['#e7e1d2','#a55cff','#c58d4e','#22252f'][p.fit];X.fillStyle=fc;rr(W/2-12,H*.76,24,55,5);text('SPACE TO BUY NEAREST · 1-4 CHANGE FIT',W/2,H-25,11,'#b0b7c8','center',800)}
function render(){X.clearRect(0,0,W,H);if(!playing){requestAnimationFrame(render);return}if(shop)shopDraw();else{drawCity();hud()}requestAnimationFrame(render)}
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);requestAnimationFrame(loop)}
function startGame(){audio=new (AudioContext||webkitAudioContext)();document.querySelector('#boot').classList.add('hide');if(location.search.includes('playtest'))document.querySelector('#boot').style.display='none';playing=1;reset();beep(220,.15,'sawtooth');setTimeout(()=>beep(440,.2,'sawtooth'),120)} document.querySelector('#start').onclick=startGame; reset();render();requestAnimationFrame(loop); if(location.search.includes('playtest'))setTimeout(()=>{startGame();if(location.search.includes('store'))enterStore(stores[1])},50);
</script></body></html>
